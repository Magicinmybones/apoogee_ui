<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apogee — Propel your mission-critical data to the absolute peak</title>
<meta name="description" content="Advanced reasoning systems and predictive models built for the unknown.">
<link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/stix-two-math.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/switzer-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage-frame">
  <div class="stage">

    <!-- Background photograph, positioned exactly as in the source design -->
    <img class="stage__photo" src="assets/images/hero-rocket.png" alt="" aria-hidden="true" fetchpriority="high">

    <!-- Radial warm glow overlay -->
    <div class="stage__glow" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#" aria-label="Apogee — home">
        <img class="brand__mark" src="assets/svg/apogee-mark.svg" alt="" aria-hidden="true">
        <span class="brand__name">Apogee</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link nav__link--has-menu" href="#platform">
          Platform
          <svg class="nav__chevron" width="7" height="4" viewBox="-0.5 -0.5 7 4" fill="none" aria-hidden="true">
            <path d="M0 0L3 3L6 0" stroke="currentColor" stroke-width="1"/>
          </svg>
        </a>
        <a class="nav__link" href="#pricing">Pricing</a>
        <a class="nav__link" href="#resourses">Resourses</a>
        <a class="nav__link" href="#blog">Blog</a>
      </nav>

      <div class="header-actions">
        <a class="button button--ghost" href="#login">Login</a>
        <a class="button button--solid" href="#demo">Book a demo</a>
      </div>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Menu">
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>
    </header>

    <div class="mobile-menu" id="mobile-menu" hidden>
      <a class="mobile-menu__link" href="#platform">Platform</a>
      <a class="mobile-menu__link" href="#pricing">Pricing</a>
      <a class="mobile-menu__link" href="#resourses">Resourses</a>
      <a class="mobile-menu__link" href="#blog">Blog</a>
      <div class="mobile-menu__actions">
        <a class="button button--ghost" href="#login">Login</a>
        <a class="button button--solid" href="#demo">Book a demo</a>
      </div>
    </div>

    <main class="hero">
      <div class="hero__badge">
        <div class="hero__badge-row">
          <span class="hero__badge-label">Backed by:</span>
          <img class="hero__badge-logo" src="assets/svg/y-combinator.svg" alt="Y Combinator" width="93" height="19">
        </div>
      </div>

      <!-- The source text is "Propel your <LS>mission-critical data to <LS>the absolute peak".
           The spaces before each U+2028 line separator are part of the line and are
           counted when the line is centred, so they are kept as non-breaking spaces. -->
      <h1 class="hero__title">Propel your&nbsp;<br>mission-critical data to&nbsp;<br>the absolute peak</h1>

      <p class="hero__subtitle">Advanced reasoning systems and predictive models built for the unknown</p>
    </main>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
